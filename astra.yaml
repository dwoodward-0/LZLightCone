    label: "Four WS2024 exposure categories"
    claim: "WS2024 exposure is split into four categories by flow/tag state — (1) high-mixing (no radon tag), (2) low-mixing with tag inactive, (3) low-mixing tag-active and radon-tagged, (4) low-mixing tag-active and radon-untagged — each entering the likelihood as a separate sample."
    created_at: "2026-11-09T12:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2410.17036"
        version: 3
        quote:
          exact: "To summarize, we have four categories of WS2024 exposure: (1) high-mixing, where a radon tag is not possible; (2) low-mixing, but with the radon tag inactive due to interruptions; (3) low-mixing, active radon tag and radon-tagged, with a high probability to contain 214Pb decays; and (4) low-mixing, active radon tag and radon-untagged, with a lower probability to contain 214Pb decays."
          prefix: "induced by power outages, are labeled as radon-tag-inactive. "
          suffix: "For WS2024, 15% of the low-mixing, tag-active exposure"
        location:
          page: 6
decisions:
  statistics:
    id: statistics
    label: "Statistical inference machinery"
    rationale: "How the limit/sensitivity is computed from the expected spectra. The plan: 2D binned profile likelihood (primary) plus a cut-and-count with Feldman-Cousins as a transparent cross-check. Note LZ itself used an unbinned PLR — the binned 2D likelihood is a documented approximation to it."
    default: both_with_crosscheck
    options:
      both_with_crosscheck:
        label: "2D binned profile likelihood + FC cut-and-count cross-check"
        description: "Binned Poisson profile likelihood in (S1c, log10 S2c) with background-rate nuisance parameters, plus a cut-and-count in the ROI with Feldman-Cousins 90% CL; compare the two sensitivity curves as an internal validation."
        insights: [lz_plr_unbinned_2d, lz_unified_interval_two_sided, plr_recommended_test_statistic, raster_scan_per_mass, two_sided_ts_recommended, fc_profile_construction_equivalence, cl_90_primary, mu_strictly_positive, mu_effective_estimator, median_brazil_band, ts_distributions_from_mc, coverage_checks_recommended, sensitivity_via_simulation, asymptotic_xenon1t_caution, pcl_minus_1sigma, evidence_3sigma_global, lee_only_if_local_3sigma, lower_limit_reporting_threshold, report_smallest_p0, background_gof_required, nuisance_params_in_likelihood, lz_six_samples_unbinned_ml, lz_ws2022_sixth_sample, lz_plr_test_statistic, lz_ws2024_power_constraint, lz_headline_limits, lz_min_limit_and_median, lz_median_3sigma_discovery, lz_fig5_median_postfit, lz_sensitivity_bands, lz_best_fit_wimps_zero, lz_likelihood_nuisances, lz_neutron_sideband_insitu, lz_table_s1_sample_exposures]
      profile_likelihood_2d:
        label: "2D binned profile likelihood only"
        description: "Poisson likelihood per (S1c, log10 S2c) bin, profile likelihood ratio test statistic, median expected limit."
        insights: [lz_plr_unbinned_2d, lz_likelihood_constraint_terms, lz_power_constraint, lz_median_sensitivity_reported, lz_limit_minima, lz_exposure_fv_mass, plr_recommended_test_statistic, raster_scan_per_mass, two_sided_ts_recommended, cl_90_primary, mu_strictly_positive, mu_effective_estimator, median_brazil_band, nuisance_params_in_likelihood, lz_ws2024_roi_definition, lz_six_samples_unbinned_ml, lz_gof_binned_projections, lz_plr_test_statistic, lz_likelihood_nuisances]
      cut_and_count_fc:
        label: "Cut-and-count with Feldman-Cousins only"
        description: "Define ROI in (S1c, log10 S2c), count expected events, FC confidence belt on signal counts, convert to cross-section limit via efficiency and exposure."
        insights: [lz_unified_interval_two_sided, lz_power_constraint, fc_profile_construction_equivalence, cl_90_primary, ts_distributions_from_mc, asymptotic_xenon1t_caution, pcl_minus_1sigma]
  background_components:
    id: background_components
    label: "Background components simulated"
    rationale: "Which background sources enter the expectation model as independently simulated, rate-tunable components. WS2022 used nine components; WS2024's Table 1 is the fuller list to extract."
    default: all_table1
    options:
      all_table1:
        label: "Every component in LZ's background table"
        description: "Simulate each component listed in the LZ background table (e.g. WS2022's nine; WS2024 Table 1) through the response model, each with its own source spectrum and rate, validated against the published distributions."
        insights: [lz_background_nine_components, lz_background_expected_counts, lz_37ar_neutron_constraints, lz_observed_335_events, neutrino_flux_convention, atmospheric_flux_fluka_20pct, dsnb_50pct_uncertainty, neutrino_wimp_mimic_masses, lz_exposure_4p2ty, lz_fiducial_mass_5p5t, lz_live_time_220days, lz_fv_boundaries, lz_fv_radial_wall, lz_signal_background_models_nest, lz_xe124_dec_model, lz_neutron_sideband_insitu, lz_mixing_state_params, lz_likelihood_nuisances, lz_fig4_projection, lz_fig4_panels, lz_table1_scope, lz_bkg_214pb, lz_bkg_85kr_39ar_detgammas, lz_bkg_solar_nu_er, lz_bkg_212pb_218po, lz_bkg_tritium_c14, lz_bkg_xe136_2nubb, lz_bkg_xe124_dec, lz_bkg_127xe_125xe_ec, lz_bkg_accidentals, lz_bkg_atm_nu_nr, lz_bkg_b8_hep_nu_nr, lz_bkg_detector_neutrons, lz_bkg_total, lz_table_s1_sample_exposures, lz_radon_tag_fractions, lz_four_exposure_categories]
      four_classes:
        label: "Four microphysics classes only"
        description: "Group backgrounds into ER, NR, surface, accidental classes with one tunable rate per class."
        insights: [lz_background_nine_components, lz_bkg_xe124_dec, lz_bkg_127xe_125xe_ec, lz_bkg_accidentals, lz_bkg_atm_nu_nr, lz_bkg_b8_hep_nu_nr, lz_bkg_detector_neutrons]
      er_nr_only:
        label: "ER + NR only"
        description: "Minimal two-component model; fastest, but omits surface/accidental shapes."
        insights: [neutrino_wimp_mimic_masses]
  efficiency_treatment:
    id: efficiency_treatment
    label: "Signal analysis efficiency"
    rationale: "The published analysis efficiency folds in event-level cuts whose details are not public; recreating it would couple validation to unmodelable details. Decision: take the published curve as an input."
    default: input_published_curve
    options:
      input_published_curve:
        label: "Published efficiency curve as input"
        description: "Take LZ's published total analysis efficiency (from the data release) as a declared input, applied identically to signal and background components."
        insights: [lz_data_release_efficiency_curve, lz_roi_definition, lz_efficiency_50pct_kev, lz_nr_efficiency_fig2, lz_nr_efficiency_50pct, lz_s1_ss_efficiency, lz_nest_header_hepdata]
      recreate_from_cuts:
        label: "Recreate efficiency from modeled cuts"
        description: "Model trigger, S1 threshold, single-scatter and ROI efficiencies from published stage descriptions; risks mismatch on event-level cut details."
        insights: [lz_efficiency_curve_staged, lz_efficiency_uncertainty, lz_roi_definition, lz_fv_boundaries, lz_fv_radial_wall, lz_ws2024_roi_definition, lz_s1_ss_efficiency]
  response_model:
    id: response_model
    label: "Detector response / microphysics model"
    rationale: "How recoil energy becomes (S1, S2). User decision: use the NEST library itself via the nestpy Python bindings rather than reimplementing the microphysics — LZ's published WS2024 header should work with NEST directly, and the released nestpy wheel ships the LZ_WS2024 detector as a built-in. The HEPData header input (lz_nest_header_hepdata) cross-checks that the packaged detector parameters match LZ's published ones; if they ever disagree, the documented fallback is a source build of nestpy with the header copied into lib/nest. Which parameter set to pin is its own decision (nest_parameter_set)."
    default: nest_library
    options:
      nest_library:
        label: "NEST library via nestpy bindings"
        description: "Run NEST itself through its official Python bindings (nestpy on PyPI), with the LZ_WS2024 built-in detector cross-checked against the published HEPData header. No microphysics code of our own; validation still against LZ's published band figures."
        insights: [lz_nest_header_hepdata, lz_signal_background_models_nest, lz_nest_application_sim, nest_version_default]
      nest_implementation:
        label: "Own NEST-style microphysics implementation"
        description: "Implement the NEST yield/recombination/fluctuation models ourselves, using LZ's published tuned parameters as inputs where available."
        insights: [lz_nest_tuned_g1_g2, lz_nest_skewness_disabled, lz_nest_params_table_s2, lz_detector_fields, detector_response_out_of_scope, background_gof_required, nest_version_default, er_recomb_from_qy, er_qy_first_subtraction, er_qy_sigmoid_params, er_box_birks_split, er_work_function, er_nex_ni_ratio, er_fano_factor, er_recomb_fluct_nonbinomial, er_gamma_separate_model, nr_total_quanta_powerlaw, nr_qy_model, nr_ly_model, nr_hard_cutoff, nr_fano_separate, nr_recomb_fluct, nr_lindhard_k_and_nex_ni, box_model_tib_values, birks_k_values, counting_fluctuation_implementation, validation_ranges, nest_fully_empirical, er_energy_partition_equations, exciton_ion_ratio_alpha_006, recombination_doke_birks_long_tracks, recombination_thomas_imel_short_tracks, zero_field_fitted_parameters, field_dependence_of_parameters, recombination_fluctuation_model, s1_s2_anticorrelation, nr_lindhard_model, nr_field_dependence, nr_predictions_vs_data, validity_range_and_datasets, geant4_low_energy_limitation, lz_drift_field_97vcm, lz_nest_g1_g2, lz_nest_er_band_tuning, lz_signal_background_models_nest, lz_nest_application_sim, lz_nest_header_hepdata, lz_nest_single_electron_size, lz_nest_extraction_efficiency, lz_ec_charge_yield]
      physics_parametrized:
        label: "Physics-parametrized yields"
        description: "Lindhard quenching + published yield fits + Poisson/Gaussian resolution; simpler but less faithful band shapes."
        insights: [lz_nest_params_table_s2, detector_response_out_of_scope, background_gof_required, er_box_birks_split, nr_total_quanta_powerlaw, box_model_tib_values, birks_k_values, nest_fully_empirical, zero_field_fitted_parameters, field_dependence_of_parameters, validity_range_and_datasets, nr_predictions_vs_data, lz_nest_er_band_tuning, lz_ec_charge_yield]
  halo_model:
    id: halo_model
    label: "Astrophysical (halo) model"
    rationale: "Velocity distribution and parameters for the WIMP recoil spectrum. LZ uses the standard halo model parameterized per the community conventions paper (Baxter et al. 2021)."
    default: shm_standard
    options:
      shm_standard:
        label: "Standard halo model, canonical parameters"
        description: "Isotropic Maxwell-Boltzmann with truncated escape velocity; parameters per the recommended conventions (Baxter et al. 2021)."
        insights: [lz_halo_shm, shm_recommended_parameters, shm_rho0_0p3, shm_vesc_544, shm_v0_238, shm_earth_speed_29p8, shm_vpec_11_12_7, shm_fix_params_do_not_profile, report_results_under_nominal_halo]
      shm_with_variations:
        label: "SHM with parameter variations"
        description: "Explore halo-parameter uncertainty impact on sensitivity as an additional study axis."
        insights: [report_results_under_nominal_halo, halo_shape_variation_threshold_effect, shm_fix_params_do_not_profile]
  nest_parameter_set:
    id: nest_parameter_set
    label: "NEST version / detector parameter pinning"
    rationale: "LZ's two campaigns used different NEST versions and detector parameter sets: WS2022 tuned NEST 2.3.7 (g1 = 0.114 phd/photon, g2 = 47.1 phd/electron, SES 58.5 phd, extraction 80.5%); WS2024 tuned NEST 2.4.0 (g1 = 0.112 +/- 0.002, g2 = 34.0 +/- 0.9, SES 46.9 phd, extraction 72.5%), with a reproducing header file on HEPData. The validation target is the WS2024 median sensitivity, so the WS2024 set is the natural default."
    default: ws2024_nest240
    options:
      ws2024_nest240:
        label: "WS2024 parameter set (NEST 2.4.0)"
        description: "Use the WS2024 tuning: NEST 2.4.0 with g1 = 0.112, g2 = 34.0 phd/electron, single electron size 46.9 phd, extraction efficiency 72.5%, drift field 97 V/cm; HEPData header as the declared input."
        insights: [lz_nest_g1_g2, lz_nest_header_hepdata, lz_nest_single_electron_size, lz_nest_extraction_efficiency, lz_drift_field_97vcm]
      ws2022_nest237:
        label: "WS2022 parameter set (NEST 2.3.7)"
        description: "Use the WS2022 tuning: NEST 2.3.7 with g1 = 0.114, g2 = 47.1 phd/electron, skewness disabled, reduced band widths."
        insights: [lz_nest_tuned_g1_g2, lz_nest_params_table_s2, lz_nest_skewness_disabled, lz_detector_fields]
      both_compare:
        label: "Both parameter sets, compared"
        description: "Implement parameter-pinning as a switch and produce the sensitivity curve under both sets, quantifying how much the tuning change moves the median limit."
        insights: [lz_nest_header_hepdata, lz_nest_tuned_g1_g2, nest_version_default]
  test_statistic_sidedness:
    id: test_statistic_sidedness
    label: "Two-sided vs one-sided test statistic"
    rationale: "LZ uses a two-sided profile likelihood ratio test statistic, and the community conventions recommend the two-sided PLR (their Eq. 4), noting it equals the Feldman-Cousins construction when nuisance parameters are absent. A one-sided (CLs-style) variant is a common alternative worth having on the decision space."
    default: two_sided
    options:
      two_sided:
        label: "Two-sided PLR (LZ / conventions)"
        description: "Use the two-sided profile likelihood ratio test statistic for both the binned 2D likelihood and the FC cross-check."
        insights: [two_sided_ts_recommended, lz_plr_test_statistic, fc_profile_construction_equivalence]
      one_sided:
        label: "One-sided PLR"
        description: "Use a one-sided variant of the profile likelihood ratio; upper limits only."
        insights: [plr_recommended_test_statistic]
  power_constraint:
    id: power_constraint
    label: "Power constraint on the limit"
    rationale: "LZ power-constrains the limit at all masses to 1 sigma below the median expectation (WS2022 used pi_crit = 0.16 between 13 and 36 GeV/c2), which prevents downward fluctuations from producing overly strong limits at the cost of overcoverage. Whether to apply it changes the reported curve and is a standard methodological fork."
    default: applied_1sigma
    options:
      applied_1sigma:
        label: "Power constraint applied (LZ)"
        description: "Constrain the limit to 1 sigma below the median expected limit at all WIMP masses, following LZ."
        insights: [lz_ws2024_power_constraint, lz_power_constraint, pcl_minus_1sigma]
      none:
        label: "No power constraint"
        description: "Report the raw limit without a power constraint; LZ publishes this variant as the gray dot-dash line in Fig. 5."
        insights: [lz_fig5_median_postfit]
  median_sensitivity_definition:
    id: median_sensitivity_definition
    label: "Definition of the median sensitivity"
    rationale: "The validation target is LZ's median expected limit. LZ obtains it as the median of expected limits from background-only pseudo-experiments with post-fit background estimates (green/yellow bands in Fig. 5), consistent with the conventions paper's recommendation of toy Monte Carlo over asymptotic formulae. A single Asimov-dataset limit is the cheaper alternative and coincides with the median up to construction details."
    default: median_of_toy_limits
    options:
      median_of_toy_limits:
        label: "Median of toy-MC expected limits (LZ)"
        description: "Generate background-only pseudo-experiments under the expected model, compute the limit for each, take the median; 1/2-sigma bands from the 68%/95% quantiles."
        insights: [lz_fig5_median_postfit, lz_median_sensitivity_reported, ts_distributions_from_mc, sensitivity_via_simulation]
      asimov_limit:
        label: "Asimov-dataset limit"
        description: "Compute the limit on the single expected (background-only Asimov) dataset; cheaper, no MC spread, and the input to LZ-style power constraints."
        insights: [sensitivity_via_simulation, pcl_minus_1sigma]
      both_report:
        label: "Both, reported side by side"
        description: "Compute the Asimov limit and the median of toy limits; their agreement is itself a validation of the statistical machinery."
        insights: [lz_median_sensitivity_reported, sensitivity_via_simulation]
  exposure_structure:
    id: exposure_structure
    label: "Exposure / likelihood sample structure"
    rationale: "LZ splits the data into six likelihood samples (four WS2024 flow-state/radon-tag categories plus a veto-tagged sample plus the full WS2022 sample) with some nuisance parameters independent between flow states. For a forward model with no observed data, pooling the combined 4.2 tonne-year exposure into a single sample reproduces the expected total counts exactly and only neglects the nuisance-decoupling benefit of the split."
    default: combined_single
    options:
      combined_single:
        label: "Single combined exposure (simplified)"
        description: "Pool the combined 4.2 tonne-year exposure into one likelihood sample using the total expected counts of each background source."
        insights: [lz_exposure_4p2ty, lz_bkg_total, lz_table1_scope]
      six_samples_full:
        label: "Six-sample structure (LZ-faithful)"
        description: "Reproduce the six-sample split (four WS2024 flow/tag categories, veto-tagged sample, WS2022) with per-sample exposures and independent nuisances where LZ has them."
        insights: [lz_six_samples_unbinned_ml, lz_table_s1_sample_exposures, lz_mixing_state_params, lz_four_exposure_categories]
  detector_effects:
    id: detector_effects
    label: "Position-dependent detector effects in the response"
    rationale: "LZ's NEST-based application additionally models curved electron drift paths from field non-uniformities, finite position reconstruction resolution, and position-dependence of S1/S2 sizes. These widen the S1/S2 bands beyond pure microphysics fluctuations; LZ's NEST tuning compensates with reduced band widths (and skewness disabled in WS2022). A uniform 1D response with LZ's tuned band widths is the simplest model that can still reproduce the published band shapes."
    default: uniform_1d
    options:
      uniform_1d:
        label: "Uniform 1D response (no position effects)"
        description: "Model a single (position-averaged) response chain. All outputs, the ROI, and the likelihood are expressed in the corrected observables (S1c, log10 S2c) throughout; with no position dependence the LZ-style corrections are the identity, so the generated response is already the corrected-space distribution. Electron-lifetime and field-variation effects are absorbed into the effective g1/g2 and LZ's tuned (reduced) band widths."
        insights: [lz_nest_skewness_disabled, detector_response_out_of_scope, lz_nest_er_band_tuning]
      simplified_position:
        label: "Simplified position-dependent effects"
        description: "Generate raw position-dependent signals (drift-time-dependent S2 size from electron lifetime, field-dependent light/charge yields, x-y light-collection variation), then apply LZ-style corrections to obtain (S1c, log10 S2c); costs a 3D event generation model."
        insights: [lz_nest_application_sim]

inputs:
  - id: lz_nest_header_ws2024
    type: data
    label: "LZ WS2024 NEST header"
    source: data/lz_ws2024_nest_header.hh
    description: "NEST v2.4.0 header file (LZ_Result2024.hh) reproducing the ER and NR response models used in LZ's WS2024 analysis. Published on HEPData, DOI 10.17182/hepdata.155182.v2/r1 (insight lz_nest_header_hepdata). Carries the detector parameter values behind decision nest_parameter_set.ws2024_nest240 (g1 = 0.112, g2 = 34.0, SES 46.9 phd, extraction 72.5%)."
  - id: lz_efficiency_curve
    type: data
    label: "LZ WS2024 NR efficiency curve"
    source: data/lz_ws2024_efficiency.csv
    description: "Cumulative NR data-selection efficiency vs nuclear recoil energy, from the HEPData Efficiency table of the LZ WS2024 record (ins2841863, table DOI 10.17182/hepdata.155182.v2/t4). This is the published analysis efficiency taken as an input per decision efficiency_treatment.input_published_curve; reaches 50% at ~5.4 keVnr (insight lz_nr_efficiency_50pct)."
  - id: lz_si_sensitivity_reference
    type: data
    label: "LZ WS2024 SI limit + sensitivity reference"
    source: data/lz_ws2024_si_sensitivity.csv
    description: "90% CL spin-independent WIMP-nucleon cross-section curves vs WIMP mass from the HEPData SI cross section table (ins2841863): observed limit, limit without power constraint, median expected limit, +/-1 and +/-2 sigma bands, and 3-sigma discovery potential. The median column is the validation target (5.1e-48 cm2 minimum at 40 GeV/c2, insight lz_min_limit_and_median); the 1/2-sigma columns are the reference for the sensitivity bands."
  - id: lz_table1_counts_reference
    type: data
    label: "LZ WS2024 Table I background counts"
    source: data/lz_ws2024_table1_counts.csv
    description: "Expected (pre-fit) and best-fit background counts per source in the WS2024 ROI, transcribed from Table I of arXiv:2410.17036v3 (insights lz_bkg_*); every value backed by a verified quote. Serves both as the rate input for background_components.all_table1 and as the acceptance reference for the background-counts validation."
  - id: lz_ws2022_band_reference
    type: data
    label: "LZ WS2022 calibration band reference"
    source: data/lz_ws2022_band_reference.csv
    description: "ER (tritium) and NR (DD-neutron) calibration bands — median and 10%/90% quantiles of log10(S2c) as a function of S1c — digitized programmatically from the vector graphics of Fig. 1 of arXiv:2207.03764v4 (LZ WS2022, NEST 2.3.7 configuration, g1 = 0.114, g2 = 47.1), axes calibrated from the tick labels. The validation reference for er_band_validation and nr_band_validation; the bands are not published in HEPData."
  - id: lz_ws2022_nest_header
    type: data
    label: "LZ WS2022 NEST header"
    source: data/lz_ws2022_nest_header.hh
    description: "NEST v2.3.7 header file (LZ_SR1.hh) reproducing the WS2022 response, published on HEPData (DOI 10.17182/hepdata.144760.v1/r1). Carries the WS2022 detector parameters (g1 = 0.113569, g2 = 47.1, drift field 192 V/cm) and, in its comment block, the edited NRERWidthsParam band-width vector {0.4, 0.4, 0.04, 0.5, 0.19, 2.25, 0.0015, 0.046452, 0.205, 0.45, -0.2} plus the instruction SkewnessER = 0.0 for ER (skewed recombination disabled to match tritium data). Cross-checked against nestpy's built-in LZ_WS2022 by src/probe_nest_crosscheck_ws2022.py: 25/25 scalars match."
outputs:
  - id: response_model_calibration
    type: data
    format: hdf5
    label: "Calibrated microphysics response"
    description: "Calibrated NEST-style response engine outputs, consumed by every later stage: ER and NR light/charge yields vs recoil energy at the LZ drift field, and the ER/NR band medians and widths in (S1c, log10 S2c) space, written as lookup tables. Uses the NEST header input for detector parameters."
    inputs: [lz_nest_header_ws2024]
    decisions: [response_model, nest_parameter_set, detector_effects]
    recipe:
      command: "python src/build_response_model.py --output {output}"
  - id: er_band_validation
    type: figure
    format: png
    label: "Validation 1: ER band vs LZ"
    description: "Validation of the microphysics stage: the response engine (the same GetYields -> GetQuanta -> GetS1/GetS2 nestpy chain as build_response_model.py) run in the WS2022 configuration that the digitized reference corresponds to (nestpy LZ_WS2022 detector, drift field 192 V/cm from FitEF, tritium events drawn ~flat over 0.5-18.6 keVee = the beta endpoint, 1M events, ROI S2c > 600 phd re-applied at analysis level), overlaid on the digitized LZ tritium ER band. Version bridges from NEST v2.3.7 (what LZ SR1 ran) to the NEST master that nestpy vendors: NRERWidthsParam[6] passed negated (v2.4.x treats [6] > 0 as absolute Fano, [6] < 0 reproduces v2.3.7's additive term); [8]/[9] swapped (v2.3.7 reads [8] = omega width, [9] = center; master reads [8] = center, [9] = width); SkewnessER = 0.0 for ER (the header's instruction); er_parameters = the [-1]x10 sentinel (master's GetYieldBetaGR is parameterized and a positive vector would override the hardcoded v2.3.7 ER model); width vector padded with two zeros to 13 elements. The chain was verified semantically equivalent to v2.3.7 by source-level diffing (RandomGen, GetYields, GetQuanta, GetS1/GetS2 total-area paths). ACCEPTANCE: band median agrees to better than 5% relative in log10(S2c) over every comparable reference bin (achieved: max 1.05%, inside LZ's own 1% NR-mean tuning bar, insight lz_nest_er_band_tuning); band width (the (q90-q10)/2 half-width) within 5% relative OR 0.0065 absolute in log10(S2c), the floor being the digitized reference's own curve resolution. Result: max width deviation 6.0% (0.0067 abs) at S1c > 65 where tritium-spectrum support thins — a documented residual attributed to the reference's provenance (LZ's figure production, not the response chain), not tuned away."
    inputs: [lz_ws2022_band_reference, lz_ws2022_nest_header]
    decisions: [response_model, nest_parameter_set, detector_effects]
    recipe:
      command: "python src/validate_bands.py --band er --reference {inputs.lz_ws2022_band_reference} --header {inputs.lz_ws2022_nest_header} --output {output}"
  - id: nr_band_validation
    type: figure
    format: png
    label: "Validation 2: NR band vs LZ"
    description: "Validation of the microphysics stage, NR analogue of er_band_validation: the response engine run in the WS2022 configuration (nestpy LZ_WS2022 detector, the header's edited NRERWidthsParam vector, v2.3.7 default NR yield parameters, drift field 192 V/cm), overlaid on the digitized LZ DD-neutron NR band; DD events drawn ~flat over 1.0-73.5 keVnr (the max Xe recoil from a 2.45 MeV DD neutron, 4mM/(m+M)^2 * E_n — the best physically-motivated approximation of the calibration spectrum; the conditional band width is spectrum-dependent, probed against emax 20-100). Same version bridges and chain-equivalence verification as er_band_validation. ACCEPTANCE: band median within 5% relative (achieved: max 0.44%, inside LZ's own 1% tuning bar); band width within 5% relative OR 0.0065 absolute in log10(S2c) (the reference's own curve resolution). Result: max width deviation 6.9% (0.0046 abs) over S1c 40-65, where the reference half-width is narrowest (~0.06-0.08) and relative comparison least well-conditioned — a documented residual attributed to the reference's provenance (LZ's DD source spectrum and MC statistics are not published), not tuned away."
    inputs: [lz_ws2022_band_reference, lz_ws2022_nest_header]
    decisions: [response_model, nest_parameter_set, detector_effects]
    recipe:
      command: "python src/validate_bands.py --band nr --reference {inputs.lz_ws2022_band_reference} --header {inputs.lz_ws2022_nest_header} --output {output}"
  - id: efficiency_passthrough
    type: figure
    format: png
    label: "Validation 3: efficiency curve passthrough"
    description: "Sanity check that the published efficiency input is ingested faithfully: the declared lz_efficiency_curve plotted against LZ's Fig. 2 presentation (50% at 5.4 keVnr). ACCEPTANCE: plotted curve identical to the input file; 50% point at 5.4 +/- 0.1 keVnr. No analysis content — it guards the input path."
    inputs: [lz_efficiency_curve]
    decisions: [efficiency_treatment]
    recipe:
      command: "python src/plot_efficiency.py --input {inputs.lz_efficiency_curve} --output {output}"
  - id: background_models
    type: data
    format: hdf5
    label: "Per-component background models"
    description: "Every Table I background source (decision background_components.all_table1) propagated through the calibrated response into a 2D distribution in (S1c, log10 S2c), normalized to its Table I pre-fit count for the combined single exposure (decision exposure_structure.combined_single). The accidentals and detector-neutron sources are modeled from their published descriptions (data-driven in LZ)."
    inputs: [response_model_calibration, lz_table1_counts_reference]
    decisions: [background_components, exposure_structure, nest_parameter_set, detector_effects]
  - id: background_projection_validation
    type: figure
    format: png
    label: "Validation 4: background spectra vs LZ"
    description: "Validation of the background stage: our combined background model projected along the ER-band median (LZ Fig. 4's projection — a 1D view, not a stacked 2D spectrum), split per component, with the total checked against the Table I pre-fit counts. ACCEPTANCE: total ROI counts consistent with 1210 +/- 91; per-component totals within their Table I uncertainties; projection shape qualitatively consistent with the digitized Fig. 4 reference."
    inputs: [background_models, lz_table1_counts_reference]
    decisions: [background_components, exposure_structure, nest_parameter_set, detector_effects]
  - id: wimp_signal_models
    type: data
    format: hdf5
    label: "WIMP signal models per mass"
    description: "SI WIMP recoil spectra for the mass grid, drawn from the standard halo model (decision halo_model.shm_standard, parameters fixed not profiled), propagated through the response and folded with the published efficiency input. One (S1c, log10 S2c) distribution per mass, normalized to unit cross section (per-event expectation at the analysis exposure)."
    inputs: [response_model_calibration, lz_efficiency_curve]
    decisions: [halo_model, efficiency_treatment, exposure_structure, nest_parameter_set, detector_effects]
  - id: plr_sensitivity_curve
    type: table
    format: csv
    label: "2D PLR median sensitivity curve"
    description: "Primary sensitivity result: the binned 2D profile likelihood in (S1c, log10 S2c) with background-rate nuisance parameters, raster-scanned over WIMP mass. Columns: WIMP mass, median expected limit from background-only toys (decision median_sensitivity_definition.median_of_toy_limits), +/-1 and +/-2 sigma band edges, with the power constraint applied (decision power_constraint.applied_1sigma) and two-sided test statistic (decision test_statistic_sidedness.two_sided). ACCEPTANCE: compared against the LZ reference in sensitivity_vs_lz_validation."
    inputs: [background_models, wimp_signal_models]
    decisions: [statistics, background_components, exposure_structure, median_sensitivity_definition, power_constraint, test_statistic_sidedness]
  - id: fc_sensitivity_curve
    type: table
    format: csv
    label: "Cut-and-count FC sensitivity curve"
    description: "Cross-check result: cut-and-count in the (S1c, log10 S2c) ROI with Feldman-Cousins 90% CL confidence belt on signal counts, converted to cross-section limits via the efficiency input and exposure. Columns as in plr_sensitivity_curve."
    inputs: [background_models, wimp_signal_models]
    decisions: [statistics, background_components, exposure_structure, test_statistic_sidedness, power_constraint]
  - id: sensitivity_vs_lz_validation
    type: figure
    format: png
    label: "Validation 5: median sensitivity vs LZ"
    description: "The headline validation: our PLR median sensitivity curve (+/-1 and +/-2 sigma bands) overlaid on the LZ published curves from lz_si_sensitivity_reference. ACCEPTANCE: our median curve's minimum matches LZ's 5.1e-48 cm2 at 40 GeV/c2 within the statistical resolution of the toy ensemble, and the curve agrees with LZ's median across the mass range within the published 1-sigma band."
    inputs: [plr_sensitivity_curve, lz_si_sensitivity_reference]
    decisions: [statistics, median_sensitivity_definition, power_constraint]
  - id: fc_plr_crosscheck
    type: figure
    format: png
    label: "Validation 6: FC cross-check vs PLR"
    description: "Internal statistical validation: the FC cut-and-count sensitivity curve overlaid on the 2D PLR curve. ACCEPTANCE: the two curves agree within their combined band widths over the mass range where the ROI cut-and-count retains efficiency; systematic disagreement localizes to the likelihood approximation, not the microphysics."
    inputs: [plr_sensitivity_curve, fc_sensitivity_curve]
    decisions: [statistics, test_statistic_sidedness, power_constraint]
