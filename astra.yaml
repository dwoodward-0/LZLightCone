# ASTRA Analysis Specification

version: "0.0.14"
name: "xenon-wimp-sensitivity"
description: "A from-scratch model of a dual-phase xenon direct-detection experiment, modeled on LUX-ZEPLIN (LZ), that computes the instrument's sensitivity to spin-independent WIMP-nucleon scattering. NEST-style recoil microphysics (yields, recombination, fluctuations) maps a WIMP signal and each LZ background source into corrected observables (S1c, log10 S2c); LZ's published detector parameters, analysis efficiency curve, and background expectations (Table I of the WS2024 result) are declared inputs. Statistical machinery — a 2D binned profile likelihood with nuisance parameters plus a Feldman-Cousins cut-and-count cross-check — turns the expected spectra into a median sensitivity curve, validated against LZ's published median expected limit (5.1e-48 cm2 at 40 GeV/c2). Once validated, background rates become knobs for sensitivity-variation studies under alternative assumptions."

prior_insights:
  lz_plr_unbinned_2d:
    id: lz_plr_unbinned_2d
    label: "LZ WS2022 used unbinned PLR in 2D"
    claim: "LZ WS2022 performs statistical inference with an extended UNBINNED profile likelihood ratio statistic in the two-dimensional (S1c, log10 S2c) observable space, with a two-sided construction of the 90% confidence bounds — not a binned likelihood."
    created_at: "2026-11-09T12:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2207.03764"
        version: 4
        quote:
          exact: "Statistical inference of WIMP scattering cross section and mass is performed with an extended unbinned profile likelihood statistic in the log 10S2c-S1c observable space, with a two-sided construction of the 90 % confidence bounds"
          prefix: "and DEAP-3600 [75] limits. "
          suffix: " Background and signal component shapes are modeled"
        location:
          page: 7
    scope: "WS2022 analysis construction; a binned 2D likelihood is an approximation to LZ's unbinned PLR."
  lz_likelihood_constraint_terms:
    id: lz_likelihood_constraint_terms
    label: "Background rates are nuisance parameters with constraint terms"
    claim: "Background component rate uncertainties enter the likelihood as constraint terms in a combined fit; component PDF shapes in (S1c, log10 S2c) come from the Geant4-based package BACCARAT plus a custom LZ detector response simulation using the tuned NEST model."
    created_at: "2026-11-09T12:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2207.03764"
        version: 4
        quote:
          exact: "The background component uncertainties are included as constraint terms in a combined fit of the background model to the data, the result of which is also shown in Table I."
          prefix: "using the tuned nest model. "
          suffix: " Above the smallest tested WIMP mass of 9 GeV"
        location:
          page: 7
  lz_unified_interval_two_sided:
    id: lz_unified_interval_two_sided
    label: "LZ uses unified-interval (FC-style) limit construction"
    claim: "LZ treats its limit construction as a unified-interval (Feldman-Cousins-style, ref [S95]) analysis and explicitly discusses limits fluctuating below the median sensitivity as a feature of that construction."
    created_at: "2026-11-09T12:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2207.03764"
        version: 4
        quote:
          exact: "In unified interval analyses such as this, statistical fluctuations in the data create statistical fluctuations in the limit, including to values below the median sensitivity of the experiment; a further discussion of this effect is found in Section VI of [S95]."
          prefix: "the power constraint are shown, as well as the expected sensitivity. "
          suffix: " We report the median expected limit"
        location:
          page: 12
  lz_power_constraint:
    id: lz_power_constraint
    label: "Power-constrained limits between 13 and 36 GeV"
    claim: "For WIMP masses between 13 and 36 GeV/c2 the reported limit is constrained by a power criterion with power of the alternate hypothesis πcrit = 0.16 (Cowan et al.), restricting fluctuations to 1σ below the median expected limit; this introduces overcoverage (>90%)."
    created_at: "2026-11-09T12:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2207.03764"
        version: 4
        quote:
          exact: "the limit is constrained to a cross section such that the power of the alternate hypothesis is πcrit = 0.16 [78]. This restricts the fluctuation to 1σ below the median expected limit."
          prefix: "For these masses, "
          suffix: " The introduction of the power constraint also introduces overcoverage"
        location:
          page: 7
