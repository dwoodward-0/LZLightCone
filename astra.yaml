    id: lz_median_sensitivity_reported
    label: "Median expected limit is the headline sensitivity quantity"
    claim: "LZ reports the median expected limit together with 1σ and 2σ sensitivity bands around it, and recommends using the median expected limit when comparing experiments or interpreting theory compatibility — this is the validation target quantity."
    created_at: "2026-11-09T12:00:00Z"
    evidence:
      - id: ev1
        doi: "10.48550/arXiv.2207.03764"
        version: 4
        quote:
          exact: "We report the median expected limit, as well as the 1 and 2 σ bands around the median, as"
          prefix: "a further discussion of this effect is found in Section VI of [S95]. "
          suffix: "recommended, to mitigate the cognitive impact of these fluctuations."
        location:
          page: 12
